name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/IPCalcRed-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/IPCalcRed.apk

      - uses: actions/upload-artifact@v4
        with:
          name: IPCalcRed-apk
          path: out/*.apk

      # Publica el APK en la página "Releases" del repositorio en cada push a main
      - name: Publish latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: IPCalcRed (última versión)
          prerelease: true
          make_latest: true
          body: "APK compilado automáticamente desde ${{ github.sha }}. Descarga IPCalcRed.apk e instálalo en el móvil."
          files: out/IPCalcRed.apk
